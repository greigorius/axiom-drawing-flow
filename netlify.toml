[build]
  functions = "netlify/functions"
  publish   = "public"

[dev]
  command = "node server.js"
  port    = 3000

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Scheduled client-comment scan. Fires Scenario 3's webhook a few minutes after each of
# Scenario 1's ingest polls (08:00/12:00/16:00/20:00), so comments land after the drawings
# they belong to. Driving it from here rather than from a Make scenario keeps the trigger
# off the Make operations budget.
[functions."scan-comments-cron"]
  schedule = "5 8,12,16,20 * * *"
