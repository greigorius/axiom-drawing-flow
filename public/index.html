<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="/styles.css">

<body>

  <!-- Served from this site, not a CDN. unpkg went down on 18 Sep 2026 and took the whole
       cockpit with it (React failed to load, every component threw "React is not defined").
       There is no build step here, so these three files are the entire runtime — see
       public/vendor/README.md for versions and how to update them. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>

  <!-- Components loaded before app shell -->
  <script type="text/babel" src="/cockpit.jsx"></script>
  <script type="text/babel" src="/activity-feed.jsx"></script>
  <!-- App shell mounts last -->
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
